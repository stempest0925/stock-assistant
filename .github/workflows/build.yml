name: (Module) Build and publish Docker image

on:
  workflow_call:
    inputs:
      docker-registry:
        required: true
        type: string
      docker-image-name:
        required: true
        type: string
      docker-context:
        required: true
        type: string
      docker-file:
        required: true
        type: string
      github-actor:
        required: true
        type: string
    secrets:
      github-token:
        required: true

jobs:
  reusable_build_job:
    runs-on: ubuntu-22.04
    permissions:
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 cosign 签名工具
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.4"
      - name: 配置 Docker 增强构建功能
        uses: docker/setup-buildx-action@v3
      - name: 登录 Docker 服务 (${{ inputs.docker-registry }})
        uses: docker/login-action@v2
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ inputs.github-actor }}
          password: ${{ secrets.github-token }}
      - name: 生成 Docker 元数据
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ inputs.docker-registry }}/${{ inputs.docker-image-name }}
      - name: 打包 & 推送 Docker 镜像
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.docker-file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: 签名 Docker 镜像
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # {} 为左侧 echo 输入内容的占位符，等价于 cosign sign --yes ${TAGS}@${DIGEST}
        run: echo "${TAGS}" | xargs - I {} cosign sign --yes {}@${DIGEST}
