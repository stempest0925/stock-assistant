name: APP PUBLISH

on: workflow_dispatch

permissions:
  packages: write # 镜像发布权限
  id-token: write # 签名令牌权限

jobs:
  test_job:
    name: (一) 测试
    uses: ./.github/workflows/ci-test.yml
  build_job:
    name: (二) 构建
    needs: test_job
    uses: ./.github/workflows/ci-build.yml
    with:
      docker-registry: ghcr.io
  deploy_job:
    name: (三) 部署
    needs: build_job
    uses: ./.github/workflows/cd-deploy.yml
