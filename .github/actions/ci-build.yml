  build-web:
    permissions:
      packages: write
      id-token: write
    uses: ./.github/actions/build.yml@master
    with:
      docker-registry: ${{ env.DOCKER_REGISTRY }}
      docker-image-name: stock-web
      docker-context: .
      docker-file: ./apps/web/dockerfile
      github-actor: ${{ github.actor }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
